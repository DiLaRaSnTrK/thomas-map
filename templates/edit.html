<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Düzenle - Stevens Dünya Turu</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body>

<div class="container mt-4">
    <h2>Düzenle: {{ place.name_modern }}</h2>
    <form method="post" action="/admin/edit/{{ place.id }}" class="row g-3">
        <div class="col-md-6">
            <label class="form-label">Tarihi Ad</label>
            <input type="text" name="name_historic" value="{{ place.name_historic }}" class="form-control" required>
        </div>
        <div class="col-md-6">
            <label class="form-label">Modern Ad</label>
            <input type="text" name="name_modern" value="{{ place.name_modern }}" class="form-control" required>
        </div>
        <div class="col-md-4">
            <label class="form-label">Enlem</label>
            <input type="number" step="any" name="latitude" value="{{ place.latitude }}" class="form-control" required>
        </div>
        <div class="col-md-4">
            <label class="form-label">Boylam</label>
            <input type="number" step="any" name="longitude" value="{{ place.longitude }}" class="form-control" required>
        </div>
        <div class="col-md-4 d-flex align-items-center">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="is_in_ottoman" {% if place.is_in_ottoman %}checked{% endif %}>
                <label class="form-check-label">Osmanlı Toprağı mı?</label>
            </div>
        </div>
        <div class="col-md-6">
            <label class="form-label">Açıklama (TR)</label>
            <textarea name="description_tr" class="form-control">{{ place.description_tr }}</textarea>
        </div>
        <div class="col-md-6">
            <label class="form-label">Açıklama (EN)</label>
            <textarea name="description_en" class="form-control">{{ place.description_en }}</textarea>
        </div>
        <div class="col-12">
            <button type="submit" class="btn btn-primary">Güncelle</button>
            <a href="/admin" class="btn btn-secondary">İptal</a>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
