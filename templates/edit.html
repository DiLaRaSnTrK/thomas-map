<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Düzenle - Stevens Haritası</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body style="background-color: #f8f9fa; padding-top: 50px;">
<div class="container">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h3 class="mb-0">Yeri Düzenle: {{ place.name_modern }}</h3>
        </div>
        <div class="card-body">
            <form method="post">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Tarihi Ad</label>
                        <input type="text" name="name_historic" class="form-control" value="{{ place.name_historic }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Modern Ad</label>
                        <input type="text" name="name_modern" class="form-control" value="{{ place.name_modern }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Enlem</label>
                        <input type="number" step="any" name="latitude" class="form-control" value="{{ place.latitude }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Boylam</label>
                        <input type="number" step="any" name="longitude" class="form-control" value="{{ place.longitude }}" required>
                    </div>
                    <div class="col-12">
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" name="is_in_ottoman" id="ottomanCheck" {% if place.is_in_ottoman %}checked{% endif %}>
                            <label class="form-check-label" for="ottomanCheck">Osmanlı Toprağı mı?</label>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Açıklama (TR)</label>
                        <textarea name="description_tr" class="form-control" rows="4">{{ place.description_tr }}</textarea>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Açıklama (EN)</label>
                        <textarea name="description_en" class="form-control" rows="4">{{ place.description_en }}</textarea>
                    </div>
                    <div class="col-12 mt-4">
                        <button type="submit" class="btn btn-success">Değişiklikleri Kaydet</button>
                        <a href="/admin" class="btn btn-secondary">Vazgeç</a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
