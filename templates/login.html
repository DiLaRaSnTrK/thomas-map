<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Login - Stevens Dünya Turu</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tangerine:wght@700&display=swap" rel="stylesheet">

    <style>
        body {
            background-image: url("/static/images/9.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            background-color: rgba(43, 25, 0, 0.85);
            border-radius: 15px;
            padding: 2rem;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.5);
            color: #dabc9a;
            width: 100%;
            max-width: 400px;
        }

        .login-box h4 {
            font-family: 'align', center;
            font-size: 45px;
            color: #dabc9a;
        }

        .form-label {
            color: #f5e6c4;
            font-weight: 500;
        }

        .form-control {
            background-color: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 10px;
            padding: 10px;
        }

        .btn-login {
            background-color: #dabc9a;
            color: #2b1900;
            font-weight: 600;
            border-radius: 20px;
            transition: 0.3s;
        }

        .btn-login:hover {
            background-color: #e8cda8;
        }

        .card-footer a {
            color: #dabc9a;
            text-decoration: none;
            font-weight: 500;
        }

        .card-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="login-box text-center">
        <h4 class="mb-4">Admin Girişi</h4>
        <form method="post" action="/login">
            <div class="mb-3 text-start">
                <label class="form-label">Kullanıcı Adı</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-3 text-start">
                <label class="form-label">Şifre</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-login w-100 mt-3">Giriş Yap</button>
        </form>
        <div class="mt-4">
            <a href="/"style="color: #dabc9a;">← Ana Sayfa</a>
        </div>
    </div>
</body>
</html>
