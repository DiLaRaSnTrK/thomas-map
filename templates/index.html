<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Thomas Stevens'ın Dünya Turu Haritası</title>

  <!-- Bootstrap & Font -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Tangerine:wght@700&display=swap" rel="stylesheet">

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body {
      background-image: url("/static/images/backgrnd.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      height: 100vh;
      margin: 0;
    }

    .navbar {
      background-color: rgba(43, 25, 0, 0.75);
    }

    #map {
      height: 70vh;
      border-radius: 15px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
      border: 3px solid #dabc9a;
    }

    h1 {
      color: #4d2c01;
      font-family: 'Tangerine', cursive;
      font-size: 72px;
      text-shadow: 2px 2px 5px rgba(0,0,0,0.3);
    }

    .leaflet-control-zoom a {
      background-color: #dabc9a !important;
      color: #4d2c01 !important;
      border: none !important;
    }

    .leaflet-control-zoom a:hover {
      background-color: #c3a882 !important;
      color: #4d2c01 !important;
    }

    /* Popup çerçeve tasarımı */
    .leaflet-popup-content-wrapper {
        background: #fdf5e6; /* Eskitme kağıt rengi */
        color: #4d2c01;
        border: 2px solid #dabc9a;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        padding: 5px;
    }

    /* Popup başlık stili */
    .popup-title {
        font-family: 'Tangerine', cursive;
        font-size: 2.4rem;
        font-weight: bold;
        margin: 0;
        line-height: 1;
        border-bottom: 1px double #dabc9a;
        padding-bottom: 5px;
        color: #4d2c01;
    }

    /* Popup içerik metni stili */
    .popup-text {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; /* Türkçe karakterler için güvenli modern font */
        font-size: 0.95rem;
        margin-top: 10px;
        color: #5d4037;
        line-height: 1.4;
    }

    /* Osmanlı statüsü etiketi */
    .status-badge {
        display: inline-block;
        margin-top: 8px;
        padding: 2px 8px;
        background: #dabc9a;
        border-radius: 15px;
        font-size: 0.8rem;
        font-weight: bold;
    }

    .leaflet-popup-tip {
      background-color: #dabc9a;
    }
    
  </style>
</head>
<body>

<!-- 🧭 Navbar -->
<nav class="navbar navbar-expand-sm">
  <div class="container-fluid d-flex align-items-center">
    <a class="navbar-brand d-flex align-items-center" href="/" style="color: #dabc9a; text-decoration: none;">
      <div style="width: 70px; height: 70px; overflow: hidden; border-radius: 50%;">
        <img src="/static/images/Logo.png" alt="Logo" style="width: 100%; height: 100%; object-fit: cover;">
      </div>
      <span style="font-family: 'Tangerine', cursive; font-size: 40px; margin-left: 12px;">
        Thomas Stevens'ın Dünya Turu
      </span>
    </a>

    <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
      <ul class="navbar-nav align-items-center">
        <li class="nav-item ms-3">
          <select id="languageSelect" class="form-select form-select-sm" style="background-color: #dabc9a; color: #4d2c01; border: none; border-radius: 20px; cursor: pointer;">
            <option value="tr">TR</option>
            <option value="en">EN</option>
          </select>
        </li>
        <li class="nav-item">
          <a class="btn btn-outline-light btn-sm ms-3" href="/login" style="border-color: #dabc9a; color: #dabc9a; font-weight: 500; border-radius: 20px;">
            Admin Girişi
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- 🗺 Harita -->
<div class="container mt-4">
  <h1 class="mb-4 text-center">Thomas Stevens’ın Dünya Turu Haritası</h1>
  
  <div class="d-flex justify-content-center mb-3">
      <select id="filterOttoman" class="form-select w-auto" style="background-color: #dabc9a; color: #4d2c01; border: none; border-radius: 20px; cursor: pointer;">
          <option value="all">Tüm Rota</option>
          <option value="yes">Osmanlı Toprakları</option>
          <option value="no">Diğer Bölgeler</option>
      </select>
  </div>

  <div id="map"></div>
</div>

<!-- 🧩 Leaflet Harita Scripti -->
<script>
  const places = {{ places | tojson }};
  let currentLang = 'tr';
  let markers = [];

  const map = L.map('map').setView([41.0082, 28.9784], 3);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png').addTo(map);

  function renderMarkers() {
    markers.forEach(m => map.removeLayer(m));
    markers = [];

    const filterValue = document.getElementById('filterOttoman').value;

    places.forEach(place => {
        // Boolean kontrolünü netleştiriyoruz
        const isOttoman = (place.is_in_ottoman === true || place.is_in_ottoman === 1);
        
        if (filterValue === 'yes' && !isOttoman) return;
        if (filterValue === 'no' && isOttoman) return;

        const iconColor = isOttoman ? '#4d2c01' : '#a84a32';
      
      const customIcon = L.divIcon({
        className: 'custom-marker',
        html: `<svg xmlns="http://www.w3.org/2000/svg" width="28" height="42" viewBox="0 0 24 24" fill="${iconColor}" stroke="#dabc9a" stroke-width="2"><path d="M12 2C8.13401 2 5 5.13401 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.86599-3.13401-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>`,
        iconSize: [28, 42],
        iconAnchor: [14, 42],
        popupAnchor: [0, -40]
      });

      const marker = L.marker([place.latitude, place.longitude], { icon: customIcon }).addTo(map);
      
      // 4. Dil bazlı içerik oluşturma
      // Dil bazlı değişkenler
      const title = place.name_modern;
      const desc = currentLang === 'tr' ? (place.description_tr || "") : (place.description_en || "");
      const ottomanLabel = currentLang === 'tr' ? 'Osmanlı Toprağı' : 'Ottoman Land';
      const ottomanValue = currentLang === 'tr' ? (isOttoman ? "Evet" : "Hayır") : (isOttoman ? "Yes" : "No");

      marker.bindPopup(`
          <div class="custom-popup">
              <h4 class="popup-title">${title}</h4>
              <div class="popup-text">
                  ${desc}
              </div>
              <div class="status-badge">
                  ${ottomanLabel}: ${ottomanValue}
              </div>
          </div>
      `, {
          maxWidth: 250,
          className: 'custom-leaflet-popup'
      });
      
      markers.push(marker);
    });
  }

  // Dinleyiciler
  document.getElementById('filterOttoman').addEventListener('change', renderMarkers);
  document.getElementById('languageSelect').addEventListener('change', function() {
    currentLang = this.value;
    renderMarkers();
  });

  // Başlangıç yüklemesi
  renderMarkers();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
