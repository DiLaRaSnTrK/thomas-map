<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Thomas Stevens'ın Dünya Turu Haritası</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Tangerine:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body {
      background-image: url("/static/images/backgrnd.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed; 
      min-height: 100vh; 
      margin: 0;
      overflow-x: hidden;
      padding-bottom: 80px;
    }

    .row {
      margin-top: 20px;
    }

    .navbar { background-color: rgba(43, 25, 0, 0.75); }

    #map {
      height: 70vh;
      border-radius: 15px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
      border: 3px solid #dabc9a;
    }

    h1 {
      color: #4d2c01;
      font-family: 'Tangerine', cursive;
      font-size: 60px;
      text-shadow: 2px 2px 5px rgba(0,0,0,0.3);
    }

    #detail-panel {
      height: 70vh;
      overflow-y: auto;
      background: rgba(253, 245, 230, 0.98);
      border-radius: 15px;
      border: 3px solid #dabc9a;
      box-shadow: -5px 0 15px rgba(0,0,0,0.2);
      padding: 25px;
      display: none;
    }

    .detail-title {
      font-family: 'Monotype Corsiva', Tahoma, sans-serif;
      font-size: 3rem;
      color: #4d2c01;
      border-bottom: 2px double #dabc9a;
      margin-bottom: 15px;
    }

    .detail-text {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      font-size: 1.05rem;
      color: #333;
      line-height: 1.6;
      text-align: justify;
    }

    .slider-placeholder {
      width: 100%;
      height: 250px;
      background-color: #eee;
      border-radius: 10px;
      margin-bottom: 20px;
      border: 1px solid #dabc9a;
      overflow: hidden;
    }

    .slider-img { width: 100%; height: 100%; object-fit: cover; }
    .transition-all { transition: all 0.4s ease-in-out; }
    .status-badge {
      display: inline-block;
      padding: 5px 15px;
      background: #dabc9a;
      color: #4d2c01;
      border-radius: 20px;
      font-weight: bold;
      margin-top: 15px;
    }
    .close-btn { cursor: pointer; float: right; font-size: 1.5rem; color: #4d2c01; }

    /* Modal Stilleri */
    #infoModal {
      display:none; 
      position: fixed; 
      z-index: 9999; 
      left: 0; 
      top: 0; 
      width: 100%; 
      height: 100%; 
      background-color: rgba(0,0,0,0.8); 
      align-items: center; 
      justify-content: center;
    }
    .modal-content-custom {
      background: #fdf5e6; 
      width: 85%; 
      max-width: 900px; 
      border-radius: 20px; 
      border: 4px solid #dabc9a; 
      position: relative; 
      padding: 40px; 
      box-shadow: 0 0 30px rgba(0,0,0,0.5);
    }
    .modal-close {
      position: absolute; 
      right: 20px; 
      top: 10px; 
      font-size: 35px; 
      cursor: pointer; 
      color: #4d2c01; 
      font-weight: bold;
    }

  </style>
</head>
<body>

<nav class="navbar navbar-expand-sm">
  <div class="container-fluid d-flex align-items-center">
    <a class="navbar-brand d-flex align-items-center" href="/" style="color: #dabc9a; text-decoration: none;">
      <div style="width: 70px; height: 70px; overflow: hidden; border-radius: 50%;">
        <img src="/static/images/Logo.png" alt="Logo" style="width: 100%; height: 100%; object-fit: cover;">
      </div>
      <span id="nav-title" style="font-family: 'Tangerine', cursive; font-size: 40px; margin-left: 12px;">
        Thomas Stevens'ın Dünya Turu
      </span>
    </a>

    <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
      <ul class="navbar-nav align-items-center">
        <li class="nav-item">
            <button id="info-btn" class="btn btn-outline-light btn-sm ms-3" onclick="openInfoModal()" style="border-color: #dabc9a; color: #dabc9a; font-weight: 500; border-radius: 20px;">
              Seyahat Bilgisi
            </button>
        </li>
        <li class="nav-item">
            <a id="album-btn" class="btn btn-outline-light btn-sm ms-3" href="/album" style="border-color: #dabc9a; color: #dabc9a; font-weight: 500; border-radius: 20px;">
              Seyahat Albümü
            </a>
        </li>
        <li class="nav-item">
          <a id="admin-login-btn" class="btn btn-outline-light btn-sm ms-3" href="/login" style="border-color: #dabc9a; color: #dabc9a; font-weight: 500; border-radius: 20px;">
            Admin Girişi
          </a>
        </li>
        <li class="nav-item ms-3">
          <select id="languageSelect" class="form-select form-select-sm" style="background-color: #dabc9a; color: #4d2c01; border: none; border-radius: 20px; cursor: pointer;">
            <option value="tr">TR</option>
            <option value="en">EN</option>
          </select>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container-fluid mt-4 px-4">
  <h1 id="main-title" class="mb-4 text-center">Thomas Stevens’ın Dünya Turu Haritası</h1>
  
  <div class="d-flex justify-content-center mb-3">
      <select id="filterOttoman" class="form-select w-auto" style="background-color: #dabc9a; color: #4d2c01; border: none; border-radius: 20px; cursor: pointer;">
          <option value="all">Tüm Rota</option>
          <option value="yes">Osmanlı Toprakları</option>
          <option value="no">Diğer Bölgeler</option>
      </select>
  </div>

  <div class="row">
    <div id="map-col" class="col-12 transition-all">
      <div id="map"></div>
    </div>
    <div id="detail-panel" class="col-md-4 transition-all">
      <span class="close-btn" onclick="closePanel()">&times;</span>
      <div id="panel-content"></div>
    </div>
  </div>
</div>

<div id="infoModal">
    <div class="modal-content-custom">
        <span class="modal-close" onclick="closeInfoModal()">&times;</span>
        <div class="row align-items-center">
            <div class="col-md-5 text-center">
                <img src="/static/images/Logo.png" alt="Cover" style="width: 100%; max-width: 280px; border-radius: 10px; box-shadow: 5px 5px 15px rgba(0,0,0,0.3); border: 2px solid #dabc9a;">
            </div>
            <div class="col-md-7">
                <h2 id="modal-title" style="font-family: 'Tangerine', cursive; font-size: 50px; color: #4d2c01; margin-bottom: 20px; border-bottom: 2px double #dabc9a;">Seyahat Hakkında</h2>
                <div id="modal-text" class="detail-text" style="font-size: 1.1rem; color: #333; max-height: 350px; overflow-y: auto; padding-right: 10px;">
                </div>
            </div>
        </div>
    </div>
</div>

<script>
  const places = {{ places | tojson }};
  let currentLang = localStorage.getItem('stevens_lang') || 'tr';
  let markers = [];

  const translations = {
    tr: {
      navTitle: "Thomas Stevens'ın Dünya Turu",
      mainTitle: "Thomas Stevens’ın Dünya Turu Haritası",
      filterAll: "Tüm Rota",
      filterOttoman: "Osmanlı Toprakları",
      filterOther: "Diğer Bölgeler",
      adminLogin: "Admin Girişi",
      infoBtn: "Seyahat Bilgisi",
      albumBtn: "Seyahat Albümü",
      histName: "Seyahat Tarihi",
      ottomanLabel: "Osmanlı Toprağı",
      transportLabel: "Ulaşım Aracı",
      infoTitle: "Seyahat Hakkında",
      yes: "Evet", no: "Hayır",
      infoBody: "Thomas Stevens, 1884-1886 yılları arasında yüksek tekerlekli (penny-farthing) bisikletiyle dünyayı dolaşan ilk insandır. San Francisco'dan başlayan bu destansı yolculukta Stevens; Avrupa, Osmanlı İmparatorluğu, İran ve Hindistan'ı aşarak macerasını tamamlamıştır."
    },
    en: {
      navTitle: "Thomas Stevens' World Tour",
      mainTitle: "Thomas Stevens' World Tour Map",
      filterAll: "Full Route",
      filterOttoman: "Ottoman Territories",
      filterOther: "Other Regions",
      adminLogin: "Admin Login",
      infoBtn: "Journey Info",
      albumBtn: "Travel Album",
      histName: "Travel Date",
      ottomanLabel: "Ottoman Land",
      transportLabel: "Transport",
      infoTitle: "About the Journey",
      yes: "Yes", no: "No",
      infoBody: "Thomas Stevens was the first person to circle the globe by bicycle (penny-farthing) between 1884 and 1886. Starting from San Francisco, Stevens crossed Europe, the Ottoman Empire, Persia, and India to complete his adventure."
    }
  };

  const map = L.map('map').setView([41.0082, 28.9784], 3);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png').addTo(map);

  function updateStaticTexts() {
    const t = translations[currentLang];
    document.getElementById('nav-title').innerText = t.navTitle;
    document.getElementById('main-title').innerText = t.mainTitle;
    document.getElementById('admin-login-btn').innerText = t.adminLogin;
    document.getElementById('info-btn').innerText = t.infoBtn;
    document.getElementById('album-btn').innerText = t.albumBtn;
    
    const filter = document.getElementById('filterOttoman');
    filter.options[0].text = t.filterAll;
    filter.options[1].text = t.filterOttoman;
    filter.options[2].text = t.filterOther;
    document.getElementById('languageSelect').value = currentLang;
  }

  function renderMarkers() {
    markers.forEach(m => map.removeLayer(m));
    markers = [];
    const filterValue = document.getElementById('filterOttoman').value;

    places.forEach(place => {
      const isOttoman = (place.is_in_ottoman === true || place.is_in_ottoman === 1);
      if (filterValue === 'yes' && !isOttoman) return;
      if (filterValue === 'no' && isOttoman) return;

      const iconColor = isOttoman ? '#4d2c01' : '#a84a32';
      const customIcon = L.divIcon({
        className: 'custom-marker',
        html: `<svg xmlns="http://www.w3.org/2000/svg" width="28" height="42" viewBox="0 0 24 24" fill="${iconColor}" stroke="#dabc9a" stroke-width="2"><path d="M12 2C8.13401 2 5 5.13401 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.86599-3.13401-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>`,
        iconSize: [28, 42],
        iconAnchor: [14, 42]
      });

      const marker = L.marker([place.latitude, place.longitude], { icon: customIcon }).addTo(map);
      place.marker = marker;
      marker.on('click', () => showDetails(place));
      markers.push(marker);
    });
  }

  function showDetails(place) {
    const t = translations[currentLang];
    
    // Reset Markers
    places.forEach(p => {
        if (p.marker) {
            const isOttoman = (p.is_in_ottoman === true || p.is_in_ottoman === 1);
            const iconColor = isOttoman ? '#4d2c01' : '#a84a32';
            p.marker.setIcon(L.divIcon({
                className: 'custom-marker',
                html: `<svg xmlns="http://www.w3.org/2000/svg" width="28" height="42" viewBox="0 0 24 24" fill="${iconColor}" stroke="#dabc9a" stroke-width="2"><path d="M12 2C8.13401 2 5 5.13401 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.86599-3.13401-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>`,
                iconSize: [28, 42],
                iconAnchor: [14, 42]
            }));
            p.marker.setZIndexOffset(0);
        }
    });

    if (place.marker) {
        const isOttoman = (place.is_in_ottoman === true || place.is_in_ottoman === 1);
        const iconColor = isOttoman ? '#4d2c01' : '#a84a32';
        place.marker.setIcon(L.divIcon({
            className: 'custom-marker-active',
            html: `<svg xmlns="http://www.w3.org/2000/svg" width="40" height="60" viewBox="0 0 24 24" fill="${iconColor}" stroke="#fff" stroke-width="3"><path d="M12 2C8.13401 2 5 5.13401 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.86599-3.13401-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>`,
            iconSize: [40, 60],
            iconAnchor: [20, 60]
        }));
        place.marker.setZIndexOffset(1000);
    }

    document.getElementById('map-col').classList.replace('col-12', 'col-md-8');
    document.getElementById('detail-panel').style.display = 'block';

    const desc = currentLang === 'tr' ? (place.description_tr || "") : (place.description_en || "");
    const ottomanStatus = place.is_in_ottoman ? t.yes : t.no;

    document.getElementById('panel-content').innerHTML = `
      <h2 class="detail-title">${place.name_modern}</h2>
      <div class="slider-placeholder">
        <img src="/static/images/vintage.png" class="slider-img" alt="Visual">
      </div>
      <div class="detail-text">
        <p><strong>${t.histName}:</strong> ${place.name_historic}</p>
        <p><strong>${t.transportLabel}:</strong> ${place.transport_type || '-'}</p>
        <p>${desc}</p>
      </div>
      <div class="status-badge">${t.ottomanLabel}: ${ottomanStatus}</div>
    `;
    setTimeout(() => { map.invalidateSize(); }, 400);
  }

  function closePanel() {
    document.getElementById('map-col').classList.replace('col-md-8', 'col-12');
    document.getElementById('detail-panel').style.display = 'none';
    renderMarkers();
    setTimeout(() => { map.invalidateSize(); }, 400);
  }

  function openInfoModal() {
    const t = translations[currentLang];
    document.getElementById('modal-title').innerText = t.infoTitle;
    document.getElementById('modal-text').innerText = t.infoBody;
    document.getElementById('infoModal').style.display = 'flex';
  }

  function closeInfoModal() { document.getElementById('infoModal').style.display = 'none'; }

  document.getElementById('languageSelect').addEventListener('change', function() {
    currentLang = this.value;
    localStorage.setItem('stevens_lang', currentLang);
    updateStaticTexts();
    renderMarkers();
    closePanel();
  });

  document.getElementById('filterOttoman').addEventListener('change', renderMarkers);

  updateStaticTexts();
  renderMarkers();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
