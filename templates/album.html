<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Seyahat Albümü - Thomas Stevens</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Tangerine:wght@700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/css/lightbox.min.css">

  <style>
    body {
      background-image: url("/static/images/backgrnd.png");
      background-size: cover;
      background-position: center; 
      background-attachment: fixed;
      min-height: 100vh;
      margin: 0;
    }
    .navbar { background-color: rgba(43, 25, 0, 0.85); }
    
    h1 {
      color: #4d2c01;
      font-family: 'Tangerine', cursive;
      font-size: 60px;
      text-shadow: 2px 2px 5px rgba(0,0,0,0.3);
      text-align: center;
      margin-top: 20px;
    }

    .nav-tabs .nav-link {
        color: #4d2c01;
        font-weight: bold;
        border: none;
        font-size: 1.2rem;
    }
    .nav-tabs .nav-link.active {
        background-color: #dabc9a;
        color: #4d2c01;
        border-radius: 10px 10px 0 0;
    }
    
    .gallery-container {
        background: rgba(253, 245, 230, 0.95);
        border-radius: 15px;
        padding: 30px;
        border: 3px solid #dabc9a;
        box-shadow: 0 0 15px rgba(0,0,0,0.3);
        margin-top: 20px;
        margin-bottom: 50px;
    }

    .gallery-img {
        width: 100%;
        height: 250px;
        object-fit: cover;
        border-radius: 10px;
        border: 2px solid #dabc9a;
        transition: transform 0.3s ease;
        cursor: pointer;
    }
    .gallery-img:hover {
        transform: scale(1.03);
        box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-sm">
  <div class="container-fluid d-flex align-items-center">
    <a class="navbar-brand d-flex align-items-center" href="/" style="color: #dabc9a; text-decoration: none;">
      <div style="width: 50px; height: 50px; overflow: hidden; border-radius: 50%;">
        <img src="/static/images/Logo.png" alt="Logo" style="width: 100%; height: 100%; object-fit: cover;">
      </div>
      <span style="font-family: 'Tangerine', cursive; font-size: 35px; margin-left: 12px;">
        Thomas Stevens
      </span>
    </a>
    
    <div class="collapse navbar-collapse justify-content-end">
      <ul class="navbar-nav">
        <li class="nav-item">
            <a class="btn btn-outline-light btn-sm ms-3" href="/" style="border-color: #dabc9a; color: #dabc9a; border-radius: 20px;">
              < Haritaya Dön
            </a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container">
    <h1>Seyahat Albümü</h1>

    <div class="gallery-container">
        <ul class="nav nav-tabs" id="albumTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="book1-tab" data-bs-toggle="tab" data-bs-target="#book1" type="button" role="tab">1. Kitap</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="book2-tab" data-bs-toggle="tab" data-bs-target="#book2" type="button" role="tab">2. Kitap</button>
            </li>
        </ul>

        <div class="tab-content mt-4" id="albumTabsContent">
            
            <div class="tab-pane fade show active" id="book1" role="tabpanel">
                <div class="row g-4">
                    {% if book1 %}
                        {% for img in book1 %}
                        <div class="col-md-4 col-sm-6">
                            <a href="{{ img }}" data-lightbox="book1" data-title="1. Kitap Fotoğrafı">
                                <img src="{{ img }}" class="gallery-img" alt="1. Kitap">
                            </a>
                        </div>
                        {% endfor %}
                    {% else %}
                        <p class="text-center text-muted">Henüz bu albümde fotoğraf yok.</p>
                    {% endif %}
                </div>
            </div>

            <div class="tab-pane fade" id="book2" role="tabpanel">
                <div class="row g-4">
                    {% if book2 %}
                        {% for img in book2 %}
                        <div class="col-md-4 col-sm-6">
                            <a href="{{ img }}" data-lightbox="book2" data-title="2. Kitap Fotoğrafı">
                                <img src="{{ img }}" class="gallery-img" alt="2. Kitap">
                            </a>
                        </div>
                        {% endfor %}
                    {% else %}
                        <p class="text-center text-muted">Henüz bu albümde fotoğraf yok.</p>
                    {% endif %}
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/js/lightbox-plus-jquery.min.js"></script>
</body>
</html>
